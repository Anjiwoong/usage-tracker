[project]
name = "usage-tracker"
version = "0.1.0"
description = "macOS menubar app for Cursor, Codex, and Claude usage"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
usage-tracker = "usage_tracker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
